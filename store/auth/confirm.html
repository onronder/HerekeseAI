<!DOCTYPE html>

<head>

<script>
/* Dil, e-posta şablonundan ?lang= ile gelir; store.js yüklenmeden basılmalı */
(function () {
  var lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "tr";
  document.documentElement.lang = lang;
  document.addEventListener("DOMContentLoaded", function () {
    document.body.dataset.lang = lang;
  });
  window.__confirmLang = lang;
})();
</script>
</head>
<body data-page="confirm" class="ruled page-full">

  <div class="reader-bar">

      <p class="muted mono">BAĞLANTI DOĞRULANIYOR…</p>
    </div>
  </div>

<!-- AUTH MODAL (şifre sıfırlama modu bunu kullanır) -->
