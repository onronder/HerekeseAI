<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Secure connection — SSL/TLS, SHA-256">
  <title>Secure connection — SSL/TLS, SHA-256</title>
  <defs>
    <path id="ring" d="M60 11 a49 49 0 1 1 -0.1 0 z" fill="none"/>
  </defs>
  <!-- outer and inner circles -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="#f2ead7" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="40" fill="none" stroke="#f2ead7" stroke-opacity="0.35" stroke-width="1"/>
  <!-- ring text -->
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10"
        letter-spacing="4.59" fill="#f2ead7" fill-opacity="0.75">
    <textPath href="#ring">SECURE CONNECTION · SSL/TLS ·</textPath>
  </text>
  <!-- padlock -->
  <path d="M53 55 v-5.5 a7 7 0 0 1 14 0 V55" fill="none" stroke="#f2ead7" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round"/>
  <rect x="48" y="55" width="24" height="19" rx="2.5" fill="none" stroke="#f2ead7" stroke-opacity="0.85" stroke-width="2"/>
  <path d="M54.5 64.5 l4 4 L66 60.5" fill="none" stroke="#e85d3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- signature algorithm -->
  <text x="60" y="88" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="8.5" letter-spacing="1.6" fill="#f2ead7" fill-opacity="0.75">SHA-256</text>
</svg>
